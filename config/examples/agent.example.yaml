ssh:
  connect_timeout: 10
  server_alive_interval: 5
  server_alive_count_max: 2
observation:
  raw_log_retention_days: 30
gemini:
  model: gemini-3.8-flash
  api_version: v1
  default_thinking_level: low
  investigate_thinking_level: medium
  allow_high_thinking: true
  store_interactions: false
  max_replayed_tool_rounds: 2
discord:
  enabled: true
jobs:
  max_parallel_hosts: 3
  max_recent_jobs: 20
conversation:
  remember_last_host: true
