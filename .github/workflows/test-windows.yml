name: Windows tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: py -3.12 -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\.venv\Scripts\python.exe -m ruff check .
      - run: .\.venv\Scripts\python.exe -m pytest
      - run: .\.venv\Scripts\python.exe -m vast_agent --runtime "$env:RUNNER_TEMP\vast-agent" install
      - run: .\.venv\Scripts\python.exe -m vast_agent --runtime "$env:RUNNER_TEMP\vast-agent" doctor
