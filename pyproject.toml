[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-gemini-agent"
version = "2.0.0"
description = "Read-only diagnostics for Vast.ai hosts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0", "google-genai>=2.3.0", "discord.py>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "ruff>=0.8"]

[project.scripts]
vast-agent = "vast_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701", "E702"]
